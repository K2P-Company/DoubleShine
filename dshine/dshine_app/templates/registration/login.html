{% extends 'dshine/base.html' %}
{% block title %}Zaloguj się | Double Shine{% endblock %}
{% block content %}<section class="auth"><p class="eyebrow">DOUBLE SHINE / KONTO</p><h1>Zaloguj się</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button" type="submit">Zaloguj się ↗</button></form><a class="auth-link" href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Nie masz konta? Zarejestruj się</a></section>{% endblock %}
